openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MIAW API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health and observability operations
  - name: chat
    description: Chat operations
  - name: waitlist
    description: Waitlist operations
  - name: apply
    description: Application flow operations
  - name: sessions
    description: Conversation memory (cross-session, opt-in)
  - name: stripe
    description: Enrollment payment via Stripe Checkout (P4-B)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /metrics:
    get:
      operationId: getMetrics
      tags: [health]
      summary: Operational metrics
      description: |
        Returns a real-time snapshot of error counts, request totals, uptime,
        and alert state. Protected: requires `Authorization: Bearer <METRICS_TOKEN>`
        header. Returns 503 if `METRICS_TOKEN` is not configured server-side
        (fail-safe default — the endpoint is disabled until explicitly enabled
        by the operator).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Metrics endpoint not enabled (METRICS_TOKEN not configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat:
    post:
      operationId: chat
      tags: [chat]
      summary: Stream a chat response from the AI agent
      description: |
        Sends the conversation history to Claude and streams the response as
        plain text (Transfer-Encoding: chunked). The client should consume the
        response body via ReadableStream. Rate-limited to 30 requests per hour
        per IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Streaming plain-text response
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Upstream streaming error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistRequest"
      responses:
        "201":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /apply/chat:
    post:
      operationId: applicationChat
      tags: [apply]
      summary: Stream an application interview response
      description: |
        Sends the full conversation history (qualification + application turns)
        to Claude and streams the application interview response as plain text
        (Transfer-Encoding: chunked). Uses a separate system prompt focused on
        admissions interview. Rate-limited to 40 requests per hour per IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyChatRequest"
      responses:
        "200":
          description: Streaming plain-text application interview response
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Upstream streaming error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /apply:
    post:
      operationId: submitApplication
      tags: [apply]
      summary: Submit a completed application
      description: |
        Submits the application after the interview conversation is complete.
        Triggers two sequential Claude calls: structured profile extraction
        and personalised acknowledgment generation. Responds with the
        application ID and the personalised acknowledgment text (typically
        8-14 seconds). Rate-limited to 3 submissions per IP per 24 hours.
        Requires explicit GDPR consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplySubmitRequest"
      responses:
        "201":
          description: Application submitted and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyResult"
        "400":
          description: Invalid request or missing GDPR consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (3 applications per 24 hours)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Claude processing error — application saved, acknowledgment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyErrorResult"

  /apply/status/{id}:
    get:
      operationId: getApplicationStatus
      tags: [apply]
      summary: Poll application processing status
      description: |
        Returns the current status of an application. Useful for recovery
        if the client timed out during POST /apply. Returns 404 if the
        application ID is not found (applications are in-memory; they do
        not survive server restarts).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Application ID returned by POST /apply
      responses:
        "200":
          description: Application status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyStatusResult"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /apply/portal/{token}:
    get:
      operationId: getApplicationPortal
      tags: [apply]
      summary: Get applicant portal status (P4-A)
      description: |
        Public JSON endpoint for the applicant status portal. Looks up the
        application by the opaque statusToken returned by POST /apply. Returns
        only applicant-visible data — admissionsStatus, personalised ack,
        submission date, and visitor type. fitScore, applicationId, and email
        are intentionally NOT exposed. The token is the access credential; no
        other authentication is required. Returns 404 for unknown or invalid
        tokens.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: |
            Opaque status token returned by POST /apply as `statusToken`.
            Separate from the applicationId — never use the applicationId in
            applicant-facing URLs.
      responses:
        "200":
          description: Application portal data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyPortalResult"
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /apply/portal:
    get:
      operationId: getApplicationPortalPage
      tags: [apply]
      summary: Applicant portal HTML page (P4-A)
      description: |
        Branded HTML page for applicants to check their admissions status
        and re-read their personalised acknowledgment. Served by Express
        (no React SPA required). Requires `?token=` query parameter.
        The page fetches /api/apply/portal/{token} client-side and populates
        the DOM. Marked noindex, nofollow — not intended for search engines.
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Applicant status token (same as statusToken from POST /apply)
      responses:
        "200":
          description: HTML status page
          content:
            text/html:
              schema:
                type: string

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a returnable conversation session (opt-in)
      description: |
        Called when a visitor checks "Remember our conversation" at the CTA overlay.
        Accepts the full qualification conversation (max 50 messages), makes one
        Claude API call to compress it into a 100–150 word context summary, stores
        the result in memory under an opaque UUID token with a 72-hour TTL, and
        returns the token.

        The client stores the token in `sessionStorage` (not localStorage — it
        clears on browser close). On the next visit, the client checks sessionStorage
        and calls GET /sessions/:token to restore the context before starting the
        conversation. No personal data is stored — only the conversation summary.

        Explicit opt-in only. Session creation requires the visitor to check a
        consent checkbox. No implicit or automatic session tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created — token valid for 72 hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Summary generation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{token}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Retrieve a stored session context
      description: |
        Returns the conversation summary stored under the given token.
        Returns 404 if the token is unknown or has passed its 72-hour TTL.
        The client should remove the token from sessionStorage on 404.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Opaque session token returned by POST /sessions
      responses:
        "200":
          description: Session found and still valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
        "404":
          description: Session not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stripe/checkout-session:
    post:
      operationId: createCheckoutSession
      tags: [stripe]
      summary: Create an enrollment checkout session
      description: |
        Creates a Stripe Checkout session for an accepted applicant to pay the
        enrollment fee. The caller should redirect the browser to the returned
        `url` — Stripe's hosted checkout page handles payment collection.

        On success, Stripe redirects to `/api/apply/portal?token=<token>&payment=success`.
        On cancellation, Stripe redirects to `/api/apply/portal?token=<token>&payment=cancelled`.
        The session expires 30 minutes after creation; the applicant can start a
        new session by clicking "Pay enrollment fee" again in the portal.

        Graceful 503 when `STRIPE_SECRET_KEY` is not configured server-side —
        the applicant should be directed to contact the admissions team offline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSessionRequest"
      responses:
        "200":
          description: Checkout session created — redirect browser to `url`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResult"
        "400":
          description: Missing or invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found for the given statusToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Application is not in accepted status (already enrolled, or not yet accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stripe not configured (STRIPE_SECRET_KEY not set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stripe/webhook:
    post:
      operationId: stripeWebhook
      tags: [stripe]
      summary: Stripe webhook endpoint
      description: |
        Receives signed event payloads from Stripe. Signature is verified using
        `STRIPE_WEBHOOK_SECRET` before any processing occurs.

        Handled events:
        - `checkout.session.completed` — marks application as enrolled, sends
          confirmation email to applicant and notification to admissions team.
        - `checkout.session.expired` — logged only; applicant can retry.
        - `payment_intent.payment_failed` — logged only; Stripe Checkout handles
          the retry UX directly.

        All other events are acknowledged with 200 without processing.

        IMPORTANT: This endpoint must receive the raw (unparsed) request body
        for Stripe signature verification. Configured via the `express.json()`
        verify callback in app.ts which saves `req.rawBody`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe Event object (see Stripe API docs)
      responses:
        "200":
          description: Event received and acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  type:
                    type: string
                    description: The event type that was processed
                required: [received]
        "400":
          description: Missing signature, invalid signature, or raw body unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorBreakdown:
      type: object
      description: Error counts broken down by category for a rolling time window.
      properties:
        client_errors:
          type: integer
          minimum: 0
          description: HTTP 4xx responses (excluding 429)
        server_errors:
          type: integer
          minimum: 0
          description: HTTP 5xx responses
        rate_limit_hits:
          type: integer
          minimum: 0
          description: HTTP 429 responses (rate limit exceeded)
        claude_errors:
          type: integer
          minimum: 0
          description: Errors originating from the Claude API
      required:
        - client_errors
        - server_errors
        - rate_limit_hits
        - claude_errors

    MetricsResponse:
      type: object
      description: Real-time operational metrics snapshot.
      properties:
        uptime_s:
          type: integer
          minimum: 0
          description: Server uptime in seconds since last start
        total_requests:
          type: integer
          minimum: 0
          description: Total HTTP requests received since last start
        total_rate_limit_hits:
          type: integer
          minimum: 0
          description: Total rate-limited requests since last start
        total_claude_errors:
          type: integer
          minimum: 0
          description: Total Claude API errors since last start
        errors_last_5min:
          type: integer
          minimum: 0
          description: Total errors (4xx + 5xx) in the last 5 minutes
        errors_last_10min:
          type: integer
          minimum: 0
          description: Total errors (4xx + 5xx) in the last 10 minutes
        error_breakdown_last_5min:
          $ref: "#/components/schemas/ErrorBreakdown"
        alert_count:
          type: integer
          minimum: 0
          description: Number of spike alerts fired since last start
        last_alert_at:
          type: ["string", "null"]
          format: date-time
          description: ISO 8601 timestamp of the most recent alert, or null if none
        alert_webhook_configured:
          type: boolean
          description: Whether ALERT_WEBHOOK_URL is set in the environment
      required:
        - uptime_s
        - total_requests
        - total_rate_limit_hits
        - total_claude_errors
        - errors_last_5min
        - errors_last_10min
        - error_breakdown_last_5min
        - alert_count
        - last_alert_at
        - alert_webhook_configured

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 8000
      required:
        - role
        - content

    VisitorProfile:
      type: object
      properties:
        type:
          type: string
          enum:
            - architect
            - engineer
            - researcher
            - developer
            - student
            - urban_planner
            - unknown
        context:
          type: string
        identified:
          type: boolean
        identifiedAtTurn:
          type: ["integer", "null"]
      required:
        - type
        - context
        - identified
        - identifiedAtTurn

    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          maxItems: 50
        profile:
          $ref: "#/components/schemas/VisitorProfile"
        turnCount:
          type: integer
          minimum: 0
          maximum: 30
        sessionContext:
          type: string
          maxLength: 1200
          description: |
            Optional 100–150 word summary of the visitor's previous session,
            returned by GET /sessions/:token. When present, injected as an
            additional system block so Claude recognises the returning visitor.
        detectedLanguage:
          type: string
          maxLength: 10
          description: |
            ISO 639-1 language code detected client-side from the visitor's
            messages (e.g. "es", "pt", "fr", "de", "it", "ar", "zh", "ja",
            "ko"). When present, the server injects an in-language translation
            of the tone and hard rules into the dynamic suffix, reinforcing
            Claude's natural multilingual behaviour. Absent for English or when
            language is undetermined.
      required:
        - messages

    CreateSessionRequest:
      type: object
      description: |
        Conversation messages to summarise and store as a returnable session.
        The visitor must have explicitly opted in via the "Remember our
        conversation" checkbox before this endpoint is called.
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          minItems: 1
          maxItems: 50
          description: Full qualification conversation history
        visitorType:
          type: string
          enum:
            - architect
            - engineer
            - researcher
            - developer
            - student
            - urban_planner
            - unknown
      required:
        - messages

    CreateSessionResult:
      type: object
      description: Session created — store the token in sessionStorage
      properties:
        token:
          type: string
          format: uuid
          description: Opaque UUID token — use with GET /sessions/:token on the next visit
        expiresAt:
          type: integer
          description: Unix timestamp (ms) when the session expires (72 hours from creation)
      required:
        - token
        - expiresAt

    SessionResult:
      type: object
      description: Session context for a returning visitor
      properties:
        token:
          type: string
          format: uuid
        summary:
          type: string
          description: |
            100–150 word plain-text summary of the visitor's previous conversation.
            Injected into the system prompt via the `sessionContext` field of POST /chat.
        visitorType:
          type: string
        expiresAt:
          type: integer
          description: Unix timestamp (ms) when the session expires
      required:
        - token
        - summary
        - visitorType
        - expiresAt

    WaitlistRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        visitorType:
          type: string
          enum:
            - architect
            - engineer
            - researcher
            - developer
            - student
            - urban_planner
            - unknown
        conversationLength:
          type: integer
          minimum: 0
          maximum: 30
        referrer:
          type: ["string", "null"]
          maxLength: 500
      required:
        - email
        - visitorType
        - conversationLength

    WaitlistResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        domainTld:
          type: string
      required:
        - success
        - message
        - domainTld

    ApplyChatRequest:
      type: object
      description: |
        Request body for the application interview streaming endpoint.
        Messages should include the full conversation history (both
        qualification and application turns) for full context.
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          maxItems: 100
          description: Full conversation history (qualification + application turns)
        profile:
          $ref: "#/components/schemas/VisitorProfile"
        applicationTurnCount:
          type: integer
          minimum: 0
          maximum: 20
          description: Number of application interview turns completed so far
      required:
        - messages

    ApplySubmitRequest:
      type: object
      description: |
        Complete application submission. Includes both conversation histories
        for structured extraction and the applicant's contact details.
        gdprConsent must be exactly true — false is rejected with 400.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        visitorType:
          type: string
          enum:
            - architect
            - engineer
            - researcher
            - developer
            - student
            - urban_planner
            - unknown
        qualificationMessages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          maxItems: 50
          description: Messages from the 8-turn qualification conversation
        applicationMessages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          maxItems: 50
          description: Messages from the 6-turn application interview
        portfolioUrl:
          type: string
          maxLength: 2048
          description: Optional portfolio, GitHub, or work samples URL
        gdprConsent:
          type: boolean
          enum: [true]
          description: |
            Must be exactly true. Represents explicit consent for MIAW to
            process the conversation and contact details for admissions review.
      required:
        - email
        - qualificationMessages
        - applicationMessages
        - gdprConsent

    ApplyResult:
      type: object
      description: Successful application submission response
      properties:
        applicationId:
          type: string
          format: uuid
          description: Unique application identifier for internal status polling
        statusToken:
          type: string
          format: uuid
          description: |
            P4-A: Opaque token for the public applicant portal. Separate from
            applicationId so the internal ID is never exposed in applicant-facing
            URLs. Use this to construct the portal URL:
            GET /api/apply/portal?token={statusToken}
        ack:
          type: string
          description: |
            Personalised 100-130 word acknowledgment generated by Claude,
            referencing specific details from the applicant's conversation.
        fitScore:
          type: integer
          minimum: 1
          maximum: 5
          description: Admissions fit score extracted by Claude (1 = weak, 5 = exceptional)
        message:
          type: string
      required:
        - applicationId
        - statusToken
        - ack
        - fitScore
        - message

    ApplyPortalResult:
      type: object
      description: |
        Applicant-visible application data returned by GET /apply/portal/{token}.
        Does NOT include fitScore, applicationId, or email — those are internal
        admissions data never exposed in applicant-facing endpoints.
      properties:
        admissionsStatus:
          type: string
          enum: [received, reviewed, accepted, waitlisted, declined, enrolled]
          description: Current admissions decision status
        ack:
          type: ["string", "null"]
          description: Personalised acknowledgment text. Present when status is "complete".
        submittedAt:
          type: string
          format: date-time
          description: ISO 8601 submission timestamp
        visitorType:
          type: string
          description: Self-identified visitor type (architect, engineer, etc.)
      required:
        - admissionsStatus
        - submittedAt
        - visitorType

    ApplyErrorResult:
      type: object
      description: Partial failure — application saved but processing failed
      properties:
        error:
          type: string
        applicationId:
          type: string
          format: uuid
          description: Application was saved under this ID despite the processing error
        message:
          type: string
      required:
        - error
        - applicationId
        - message

    ApplyStatusResult:
      type: object
      description: Application processing status
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [processing, complete, error]
        ack:
          type: ["string", "null"]
          description: Present only when status is "complete"
        fitScore:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
          description: Present only when status is "complete"
        errorMessage:
          type: ["string", "null"]
          description: Present only when status is "error"
      required:
        - applicationId
        - status

    CheckoutSessionRequest:
      type: object
      description: Request body for creating a Stripe enrollment checkout session
      properties:
        statusToken:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            The opaque portal token from POST /apply (returned in the response and
            embedded in the confirmation email link). Identifies the application
            without exposing the internal applicationId in browser URLs.
      required:
        - statusToken

    CheckoutSessionResult:
      type: object
      description: Stripe Checkout session URL — redirect the browser here
      properties:
        url:
          type: string
          format: uri
          description: Stripe-hosted checkout page URL. Valid for 30 minutes.
      required:
        - url

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
